    <circle cx="321" cy="91" r="1.7"/><circle cx="401" cy="46" r="2.1"/><circle cx="548" cy="96" r="1.5"/>
    <circle cx="728" cy="128" r="1.8"/><circle cx="598" cy="39" r="1.4"/>
  </g>

