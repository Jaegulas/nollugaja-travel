  <path d="M0 276 L126 196 L230 258 L345 171 L438 265 L558 195 L670 258 L800 202 L800 420 L0 420 Z" fill="#183b46" opacity=".88"/>
  <rect y="319" width="800" height="101" fill="url(#ground)"/>

  <g transform="translate(205 154)">
