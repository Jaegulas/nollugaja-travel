      <rect x="243" y="98" width="44" height="36" rx="4"/>
      <rect x="310" y="98" width="44" height="36" rx="4"/>
      <rect x="36" y="156" width="44" height="36" rx="4"/>
      <rect x="103" y="156" width="44" height="36" rx="4"/>
      <rect x="243" y="156" width="44" height="36" rx="4"/>
      <rect x="310" y="156" width="44" height="36" rx="4"/>
