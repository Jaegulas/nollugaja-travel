<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">숙소 대표 이미지</title>
  <desc id="desc">밤하늘 아래 따뜻한 조명이 켜진 호텔과 산을 표현한 숙박 테마 일러스트</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10223c"/>
      <stop offset="0.55" stop-color="#1e4660"/>
      <stop offset="1" stop-color="#315f68"/>
    </linearGradient>
    <linearGradient id="mount" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#244653"/>
      <stop offset="1" stop-color="#163744"/>
    </linearGradient>
    <linearGradient id="hotel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#203543"/>
      <stop offset="1" stop-color="#142630"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#214a45"/>
      <stop offset="1" stop-color="#102d30"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="800" height="420" fill="url(#sky)"/>
  <circle cx="664" cy="76" r="34" fill="#f7d89c" opacity=".95"/>
  <circle cx="664" cy="76" r="52" fill="#f7d89c" opacity=".12" filter="url(#glow)"/>

